
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Category Buttons -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="anime">Anime</button>
        <button class="filter-btn" data-filter="others">Others</button>

    </div>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                alt="Sunrise">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d"
                alt="Lion">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                alt="City">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                alt="Valley">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                alt="Dog">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1444723121867-7a241cacace9"
                alt="City Lights">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                alt="Lake">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a"
                alt="Dog">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                alt="River">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://hips.hearstapps.com/hmg-prod/images/vibrant-scenery-of-a-river-in-the-middle-of-a-royalty-free-image-1728411555.jpg?crop=0.99953xw:1xh;center,top"
                alt="Forest">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="img\cat.jpg"
            alt="Cat">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="img\rabbit.jpeg"
            alt="Rabbit">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://t4.ftcdn.net/jpg/19/99/99/59/360_F_1999995988_vAfmiIfNUhwOP8zDFRDG5ixtimxY5wgG.jpg"
                alt="Night City">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://hips.hearstapps.com/hmg-prod/images/tropical-waterfall-amazon-rain-forest-royalty-free-image-1728411255.jpg?crop=0.99956xw:1xh;center,top"
            alt="Waterfall">
        </div>

        <div class="gallery-item" data-category="anime">
            <img src="https://sm.ign.com/ign_in/screenshot/default/sololeveling6816_8wmw.jpg"
                alt="Solo Leveling">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://cdn.mos.cms.futurecdn.net/KHQb3Ny62YxXnCEon4mm43-1024-80.jpg.webp"
            alt="Kitten">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="img\kitten.png"
            alt="Kitten">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1508789733592-e934906d39cd?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="City">
        </div>

        <div class="gallery-item" data-category="others">
            <img src="img\avengers.jpg"
                alt="Avengers">
        </div>

        <div class="gallery-item" data-category="others">
            <img src="img\Avengers logo.jpg"
                alt="Avengers">
        </div>

        <div class="gallery-item" data-category="anime">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs_XWyBy2ONwwZsgP3ZYJh4qj__UM2GbZ8fk3NhXFKUl_gmai3PMuQULI&s=10"
                alt="Satoru Gojo">
        </div>

        <div class="gallery-item" data-category="others">
            <img src="https://thumbs.dreamstime.com/b/ancient-korean-buildings-full-bloom-cherry-blossoms-serene-landscape-featuring-traditional-pavilion-surrounded-408726704.jpg"
                alt="Korean Buildings">
        </div>

        <div class="gallery-item" data-category="others">
            <img src="https://img.magnific.com/premium-photo/traditional-korean-lunar-newyear-celebration-seollal-background-eating-exchanging-gifts-hanok_59535-12537.jpg?semt=ais_hybrid&w=740&q=80"
                alt="Korean Lunar New Year">
        </div>

        <div class="gallery-item" data-category="anime">
            <img src="https://png.pngtree.com/thumb_back/fh260/background/20250709/pngtree-beautiful-anime-princess-in-elegant-gown-fantasy-art-image_17586506.webp"
                alt="Anime Princess">
        </div>

    </main>


    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="nav prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Preview">

        <button class="nav next" id="next">&#10095;</button>

    </div>


    <script src="script.js"></script>

</body>
</html>
