<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="hero">

        <div class="logo-area">

            <img src="img/gallery logo.png" alt="Gallery Logo" class="logo">

            <div class="logo-text">
                <h1>My Image Gallery</h1>
                <p>Discover beautiful moments</p>
            </div>

        </div>

        <!-- Dark Mode -->

        <button id="theme-toggle" class="theme-toggle"
                aria-label="Switch to dark mode"
                title="Toggle dark mode">
                🌙 Dark Mode
        </button>

        <!-- Search -->

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search for images..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

    </header>


    <!-- ================= CATEGORIES ================= -->

    <section class="category-section">

    <div class="category-heading">
        <h2>Explore Categories</h2>

        <button id="toggle-categories"
                class="toggle-categories"
                aria-expanded="false"
                aria-controls="category-list"
                title="Show categories">
            <span id="category-arrow">▼</span>
        </button>
    </div>

    <div class="category-list" id="category-list">

        <!-- All -->
        <button class="category-card active" data-filter="all">

            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                alt="All">

            <span>All</span>

        </button>

        <!-- Nature -->
        <button class="category-card" data-filter="nature">

            <img
                src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                alt="Nature">

            <span>Nature</span>

        </button>

        <!-- Animals -->
        <button class="category-card" data-filter="animals">

            <img
                src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                alt="Animals">

            <span>Animals</span>

        </button>

        <!-- City -->
        <button class="category-card" data-filter="city">

            <img
                src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                alt="City">

            <span>City</span>

        </button>

        <!-- Anime -->
        <button class="category-card" data-filter="anime">

            <img
                src="https://sm.ign.com/ign_in/screenshot/default/sololeveling6816_8wmw.jpg"
                alt="Anime">

            <span>Anime</span>

        </button>

        <!--Creative Wallpaper -->
        <button class="category-card" data-filter="creative-wallpaper">

            <img
                src="img/floating-island-surrounded-by-fluffy-clouds-beautiful-sunset-chinese-building-generative-ai.jpg"
                alt="Creative Wallpaper">

            <span>Creative Wallpaper</span>

        </button>

        <!--Desktop Wallpaper -->
        <button class="category-card" data-filter="desktop-wallpaper">

            <img
                src="img/aerial-view-foggy-city.jpg"
                alt="Desktop Wallpaper">

            <span>Desktop Wallpaper</span>

        </button>

        <!-- Food & Beverages -->
        <button class="category-card" data-filter="food">

            <img
                src="img/heart-shaped-candy.jpg"
                alt="Food & Beverages">

            <span>Food & Beverages</span>

        </button>

        <!-- Others -->
        <button class="category-card" data-filter="others">

            <img
                src="img/avengers.jpg"
                alt="Others">

            <span>Others</span>

        </button>

        <!-- Favorites Category -->
        <button class="category-card" data-filter="favorites">
            <img src="your-default-image.jpg" alt="Favourites">
            <span class="favorites-category-icon">♥</span>
            <span>Favorites</span>
        </button>

    </div>

</section>

    <!-- ================= SEARCH RESULT ================= -->

    <div class="result-info">
        <span id="resultText">Showing all images</span>
    </div>


    <!-- ================= GALLERY ================= -->

    <main class="gallery" id="gallery">

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                alt="Sunrise">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="img/fish.jpg"
                alt="Fish">
        </div>

        <div class="gallery-item" data-category="food">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7EHE3CANoYHsdNL_hcrxh2jnkkLh1vBFl9cRq8ijS7w&s=10"
                alt="Cupcakes">
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                alt="Valley">
        </div>

        <div class="gallery-item" data-category="desktop-wallpaper">
            <img
                src="img/aerial-view-foggy-city.jpg"
                alt="City on top a mountain">
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                alt="Lake">
        </div>

        <div class="gallery-item" data-category="desktop-wallpaper">
            <img
                src="img/chinese-great-wall.jpg"
                alt="Great Wall of China">
        </div>

        <div class="gallery-item" data-category="food">
            <img
                src="img/apple-branch.jpg"
                alt="Apple">
        </div>

        <div class="gallery-item" data-category="food">
            <img
                src="img/cake.jpg"
                alt="Cake">
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                alt="River">
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://hips.hearstapps.com/hmg-prod/images/vibrant-scenery-of-a-river-in-the-middle-of-a-royalty-free-image-1728411555.jpg?crop=0.99953xw:1xh;center,top"
                alt="Forest">
        </div>

        <div class="gallery-item" data-category="desktop-wallpaper">
            <img
                src="img/abstract.jpg"
                alt="Abstract Wallpaper">
        </div>

        <div class="gallery-item" data-category="food">
            <img
                src="img/heart-shaped-candy.jpg"
                alt="Candy">
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://hips.hearstapps.com/hmg-prod/images/tropical-waterfall-amazon-rain-forest-royalty-free-image-1728411255.jpg?crop=0.99956xw:1xh;center,top"
                alt="Waterfall">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1546182990-dffeafbe841d"
                alt="Lion">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                alt="Dog">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1517849845537-4d257902454a"
                alt="Dog">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="img/cat.jpg"
                alt="Cat">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="img/rabbit.jpeg"
                alt="Rabbit">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://cdn.mos.cms.futurecdn.net/KHQb3Ny62YxXnCEon4mm43-1024-80.jpg.webp"
                alt="Kitten">
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="img/kitten.png"
                alt="Kitten">
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                alt="City">
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1444723121867-7a241cacace9"
                alt="City Lights">
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://t4.ftcdn.net/jpg/19/99/99/59/360_F_1999995988_vAfmiIfNUhwOP8zDFRDG5ixtimxY5wgG.jpg"
                alt="Night City">
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1508789733592-e934906d39cd?fm=jpg&q=60&w=3000&auto=format&fit=crop"
                alt="Modern City">
        </div>

        <div class="gallery-item" data-category="anime">
            <img
                src="https://sm.ign.com/ign_in/screenshot/default/sololeveling6816_8wmw.jpg"
                alt="Solo Leveling">
        </div>

        <div class="gallery-item" data-category="anime">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs_XWyBy2ONwwZsgP3ZYJh4qj__UM2GbZ8fk3NhXFKUl_gmai3PMuQULI&s=10"
                alt="Satoru Gojo">
        </div>

        <div class="gallery-item" data-category="anime">
            <img
                src="https://png.pngtree.com/thumb_back/fh260/background/20250709/pngtree-beautiful-anime-princess-in-elegant-gown-fantasy-art-image_17586506.webp"
                alt="Anime Princess">
        </div>

        <div class="gallery-item" data-category="others">
            <img
                src="img/avengers.jpg"
                alt="Avengers">
        </div>

        <div class="gallery-item" data-category="others">
            <img
                src="img/Avengers logo.jpg"
                alt="Avengers Logo">
        </div>

        <div class="gallery-item" data-category="creative-wallpaper">
            <img
                src="https://thumbs.dreamstime.com/b/ancient-korean-buildings-full-bloom-cherry-blossoms-serene-landscape-featuring-traditional-pavilion-surrounded-408726704.jpg"
                alt="Korean Buildings">
        </div>

        <div class="gallery-item" data-category="creative-wallpaper">
            <img
                src="https://img.magnific.com/premium-photo/traditional-korean-lunar-newyear-celebration-seollal-background-eating-exchanging-gifts-hanok_59535-12537.jpg?semt=ais_hybrid&w=740&q=80"
                alt="Korean Lunar New Year">
        </div>

    </main>


    <!-- ================= NO RESULT ================= -->

    <div class="no-result" id="noResult">

        <div>🔍</div>

        <h2>No images found</h2>

        <p>Try another search or category.</p>

    </div>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <button class="close" id="close">
            &times;
        </button>


        <button class="nav prev" id="prev">
            &#10094;
        </button>


        <div class="lightbox-content">

            <img
                id="lightbox-img"
                src=""
                alt="Preview"
            >

            <p id="lightbox-title"></p>

        </div>


        <button class="nav next" id="next">
            &#10095;
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
